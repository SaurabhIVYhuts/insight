# Keeps the Amber catalog crawl moving in the background.
#
# WHY THIS EXISTS: the crawl is advanced by (a) anyone loading the dashboard
# (it polls /api/insights/snapshot every ~15s until the crawl completes) and
# (b) the daily-digest job's own top-up loop. That's enough for the digest
# to have near-complete data, but on the Vercel Hobby plan you cannot run a
# every-5-minutes cron, so without this the crawl only progresses while
# someone has the dashboard open.
#
# This workflow pings the crawl-keeper endpoint every 10 minutes so a full
# catalog pass completes on its own. If you are on Vercel Pro, delete this
# file and add a second entry to vercel.json's "crons" instead:
#   { "path": "/api/insights/advance-crawl", "schedule": "*/10 * * * *" }
#
# SETUP: add two repository secrets (Settings -> Secrets and variables ->
# Actions):
#   INSIGHT_BASE_URL  e.g. https://insight.ivyhuts.com
#   CRON_SECRET       the same value set in the Vercel project

name: advance-crawl

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Advance the Amber catalog crawl
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.INSIGHT_BASE_URL }}/api/insights/advance-crawl")
          echo "HTTP $code"
          cat /tmp/body
          echo
          test "$code" = "200"
